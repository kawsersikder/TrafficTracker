<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Traffic Intersection Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
    <style>
        /* ─── Claude-style design tokens ───────────────────────── */
        :root {
            --paper:   #F0EEE6;
            --panel:   #FAF9F5;
            --panel-2: #F1EFE7;
            --ink:     #262521;
            --ink-2:   #6E6C64;
            --ink-3:   #9C9A8F;
            --line:    #E5E2D6;
            --line-2:  #D8D4C6;
            --clay:    #D97757;
            --clay-hi: #C2613F;
            --err:     #B24B3E;
            --radius: 14px;
            --radius-sm: 9px;
            --shadow: 0 1px 2px rgba(45,42,34,.04), 0 6px 20px rgba(45,42,34,.05);
            --sans: 'Hanken Grotesk', system-ui, sans-serif;
            --serif: 'Newsreader', Georgia, serif;
        }
        * { box-sizing: border-box; }
        body {
            font-family: var(--sans);
            background-color: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(900px 500px at 88% -8%, rgba(217,119,87,.07), transparent 60%),
                radial-gradient(800px 500px at 5% 110%, rgba(110,108,96,.05), transparent 55%);
        }
        .login-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .logo { width: 42px; height: 42px; color: var(--clay); margin: 0 auto 16px; display: block; }
        .brand h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 8px; }
        .brand p { font-size: 14px; color: var(--ink-2); margin: 0; }
        .field { margin-bottom: 20px; }
        .field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
        input[type=email], input[type=password] {
            width: 100%; font-family: var(--sans); font-size: 15px; color: var(--ink);
            background: var(--panel-2); border: 1px solid var(--line-2);
            border-radius: var(--radius-sm); padding: 12px 16px;
            transition: all .18s;
        }
        input:focus { outline: none; background: var(--panel); border-color: var(--clay); box-shadow: 0 0 0 3px rgba(217,119,87,.16); }
        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            font-family: var(--sans); font-size: 15px; font-weight: 600;
            padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
            cursor: pointer; transition: all .18s;
            background: var(--clay); color: #fff; box-shadow: 0 1px 2px rgba(194,97,63,.25);
            margin-top: 12px;
        }
        .btn:hover { background: var(--clay-hi); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .error-msg { color: var(--err); font-size: 13px; text-align: center; margin-top: 16px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
                <path d="M19 12H5"/><path d="M18.06 15.5L5.94 8.5"/><path d="M15.5 18.06L8.5 5.94"/>
                <path d="M12 19V5"/><path d="M8.5 18.06L15.5 5.94"/><path d="M5.94 15.5L18.06 8.5"/>
            </svg>
            <h1>Traffic Analyzer</h1>
            <p>Please sign in to access the dashboard</p>
        </div>
        <form id="login-form">
            <div class="field">
                <label for="email" class="field-label">Email Address</label>
                <input type="email" id="email" required placeholder="admin@example.com" autocomplete="username">
            </div>
            <div class="field">
                <label for="password" class="field-label">Password</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="submit-btn">Sign In</button>
            <div class="error-msg" id="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('submit-btn');

            errorMsg.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Redirect to index if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
